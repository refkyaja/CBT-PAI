<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Ujian PAI Kelas 11</title>
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi sederhana */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Font cadangan untuk teks Arab agar lebih rapi */
        .arabic-text {
            font-family: "Traditional Arabic", "Scheherazade New", serif;
        }

        /* Panel soal overview */
        .overview-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .overview-panel {
            background: white;
            border-radius: 1.5rem 1.5rem 0 0;
            padding: 1.5rem;
            width: 100%;
            max-width: 42rem;
            max-height: 75vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        .q-badge {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.875rem;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.15s;
        }
        .q-badge:hover { transform: scale(1.1); }
        .q-badge.answered  { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
        .q-badge.doubted   { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
        .q-badge.current   { background: #059669; color: white; border-color: #047857; }
        .q-badge.unanswered{ background: #f3f4f6; color: #6b7280; border-color: #d1d5db; }
    </style>
</head>

        // --- RENDER KUIS ---
        function startQuiz(chapter) {

            showOverview = false;
            renderQuestion();

            userAnswers[currentQuestionIndex] = index;
            renderQuestion();

        function toggleDoubt() {
            doubtedAnswers[currentQuestionIndex] = !doubtedAnswers[currentQuestionIndex];
            renderQuestion();

            currentQuestionIndex = index;
            showOverview = false;
            renderQuestion();

            showOverview = true;
            renderQuestion();
        }

            showOverview = false;
            renderQuestion();
        }

                currentQuestionIndex--;
                renderQuestion();

                const doubtBadge = isDoubted ? `<span class="ml-2 text-xs bg-amber-100 text-amber-700 font-semibold px-2 py-0.5 rounded-full">⚠️ Ragu</span>` : '';

                return `
            <div class="bg-white rounded-xl shadow-sm p-6 border-l-4 ${isCorrect ? 'border-emerald-500' : 'border-red-500'} mb-4 border-t border-r border-b">
                <div class="flex items-start gap-4">
                    <div class="mt-1 flex-shrink-0 w-6 h-6">
                        ${isCorrect ? icons.check : icons.cross}
                    </div>
                    <div class="flex-1">
                        <div class="font-semibold text-gray-600 mb-2 flex items-center">
                            Soal ${qIndex + 1} ${doubtBadge}
                        </div>
                        <div class="mb-4">${formatText(q.question)}</div>
                        <div class="mt-4">
                            ${optionsReviewHTML}
                        </div>
                        ${isUnanswered ? `<p class="mt-3 text-sm text-amber-600 font-medium flex items-center">⚠️ Anda tidak menjawab soal ini.</p>` : ''}
                    </div>
                </div>
            </div>
        `;
            }).join('');

            const finalScore = Math.round((score / questions.length) * 100);

            document.getElementById('app').innerHTML = `
        <div class="py-8 px-4 min-h-screen">
            <div class="max-w-3xl mx-auto fade-in">
                <!-- Result Header -->
                <div class="bg-white rounded-2xl shadow-lg p-8 text-center mb-6 border-t-4 border-emerald-600">
                    ${icons.award}
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">Hasil Ujian ${currentChapter}</h2>
                    <div class="text-6xl font-black text-emerald-600 mb-4">${finalScore}</div>
                    <p class="text-gray-600 font-medium text-lg mb-8">
                        Benar ${score} dari ${questions.length} Soal
                    </p>
                    
                    <div class="flex justify-center gap-4 flex-wrap">
                        <button onclick="startQuiz('${currentChapter}')" class="flex items-center px-6 py-3 bg-emerald-100 text-emerald-700 font-semibold rounded-xl hover:bg-emerald-200 transition-colors">
                            <span class="mr-2 w-5 h-5">${icons.rotate}</span> Ulangi Kuis
                        </button>
                        <button onclick="renderMenu()" class="flex items-center px-6 py-3 bg-white border-2 border-gray-200 text-gray-700 font-semibold rounded-xl hover:bg-gray-50 transition-colors">
                            <span class="mr-2 w-5 h-5">${icons.home}</span> Menu Utama
                        </button>
                    </div>
                </div>

                <!-- Review Section -->
                <div>
                    <h3 class="text-xl font-bold text-gray-800 px-2 mb-4">Review Jawaban:</h3>
                    ${reviewHTML}
                </div>
            </div>
        </div>
    `;
            window.scrollTo(0, 0);
        }

        // Inisialisasi Aplikasi Pertama Kali
        renderMenu();

    </script>
</body>

</html>
